name: Notificaciones Duclaud

on:
  schedule:
    # Un solo cron cada hora. La ruta decide qué enviar según la hora de Mérida
    # (7am → tareas y seguimiento, 8am → visitas de mañana, siempre → visitas en 1h).
    # Antes había 3 crons que se traslapaban a las 13 y 14 UTC y duplicaban avisos.
    - cron: '5 * * * *'
  workflow_dispatch:          # Permite correrlo manualmente para probar

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar notificaciones
        run: |
          curl -sf -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/notificaciones" \
            | jq '.'
